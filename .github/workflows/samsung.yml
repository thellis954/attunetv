name: Samsung companion preview
on:
  push:
    paths: ['samsung/**', '.github/workflows/samsung.yml']
  pull_request:
    paths: ['samsung/**', '.github/workflows/samsung.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: attune_test
          POSTGRES_PASSWORD: test-only-local-fixture
          POSTGRES_DB: attune_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U attune_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://attune_test:test-only-local-fixture@127.0.0.1:5432/attune_test
    defaults:
      run:
        working-directory: samsung
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: samsung/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build:vercel && npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AttuneTV-Samsung-UNSIGNED-preview
          path: samsung/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Samsung-browser-test-evidence
          path: samsung/test-results/
