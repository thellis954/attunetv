# Prepared deployment, not activated. Starter compute and persistent storage are paid.
services:
  - type: web
    name: attunetv-companion
    runtime: node
    plan: starter
    branch: claude/blissful-hypatia-4dfwls
    rootDir: samsung
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: node server/main.mjs
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    disk:
      name: attunetv-private-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.5.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data/attunetv
